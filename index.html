<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIGS DEPLOYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --dark-bg: #05070a;
            --card-bg: #0d1117;
            --danger: #ff4444;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark-bg);
            color: #e6edf3;
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 450px;
            background: var(--card-bg);
            padding: 2rem; border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            border: 1px solid rgba(0, 210, 255, 0.1);
        }

        h1 { color: var(--neon-blue); text-align: center; text-shadow: 0 0 10px var(--neon-blue); margin-bottom: 20px; letter-spacing: 2px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: var(--neon-blue); margin-bottom: 5px; }
        
        input[type="text"] {
            width: 100%; padding: 12px; background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; color: white; outline: none; box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: var(--neon-blue); }

        .upload-zone {
            border: 2px dashed #30363d; padding: 1.5rem; border-radius: 12px;
            text-align: center; cursor: pointer; transition: 0.3s; margin-bottom: 20px;
        }
        .upload-zone:hover { border-color: var(--neon-blue); background: rgba(0, 210, 255, 0.05); }
        #fileInput { display: none; }

        .btn-deploy {
            width: 100%; padding: 14px; background: transparent; border: 2px solid var(--neon-blue);
            color: var(--neon-blue); font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .btn-deploy:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }

        /* History */
        .history { margin-top: 30px; border-top: 1px solid #30363d; padding-top: 20px; }
        .project-item {
            background: #161b22; padding: 10px; border-radius: 8px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--neon-blue);
        }
        .project-link { color: cyan; text-decoration: none; font-size: 0.8rem; display: block; }
        .btn-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; }

        .loader { display: none; text-align: center; color: var(--neon-blue); margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>GIGS DEPLOYER</h1>

    <div class="input-group">
        <label>NAMA WEBSITE (PROJECT NAME)</label>
        <input type="text" id="webName" placeholder="misal: web-saya-keren">
    </div>

    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <i class="fas fa-file-archive" style="font-size: 2rem; color: var(--neon-blue);"></i>
        <p id="fileNameDisplay">Pilih HTML atau ZIP</p>
    </div>
    <input type="file" id="fileInput" accept=".html,.zip" onchange="document.getElementById('fileNameDisplay').innerText = this.files[0].name">

    <button class="btn-deploy" onclick="gasDeploy()">DEPLOY SEKARANG</button>
    <div class="loader" id="loader"><i class="fas fa-sync fa-spin"></i> Processing...</div>

    <div class="history">
        <p style="font-size: 0.8rem; color: #8b949e;"><i class="fas fa-history"></i> RIWAYAT & HAPUS PROYEK</p>
        <div id="historyList"></div>
    </div>
</div>

<script>
    // MASUKKAN TOKEN KAMU DI SINI
    const MY_TOKEN = "FTrv15Qawk09Gz42D3dc2qvo";

    let history = JSON.parse(localStorage.getItem('gigs_deploy_history')) || [];
    renderHistory();

    async function gasDeploy() {
        const name = document.getElementById('webName').value;
        const fileInput = document.getElementById('fileInput');
        const loader = document.getElementById('loader');

        if (!name || fileInput.files.length === 0) return alert("Isi nama web & pilih file!");
        if (MY_TOKEN === "FTrv15Qawk09Gz42D3dc2qvo") return alert("Isi token dulu di kode HTML!");

        loader.style.display = "block";
        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async (e) => {
            try {
                const res = await fetch('https://api.vercel.com/v13/deployments', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${MY_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        files: [{ file: file.name, data: btoa(unescape(encodeURIComponent(e.target.result))) }],
                        projectSettings: { framework: null }
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    history.unshift({ id: data.id, name: name, url: data.url });
                    localStorage.setItem('gigs_deploy_history', JSON.stringify(history));
                    renderHistory();
                    alert("Berhasil!");
                } else { alert("Gagal: " + data.error.message); }
            } catch (err) { alert(err.message); }
            finally { loader.style.display = "none"; }
        };
        reader.readAsText(file);
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = history.map((p, i) => `
            <div class="project-item">
                <div>
                    <strong style="font-size:0.8rem">${p.name}</strong>
                    <a href="https://${p.url}" target="_blank" class="project-link">${p.url}</a>
                </div>
                <button class="btn-del" onclick="hapusProyek('${p.id}', ${i})"><i class="fas fa-trash"></i></button>
            </div>
        `).join('');
    }

    async function hapusProyek(id, index) {
        if (!confirm("Hapus dari Vercel?")) return;
        try {
            await fetch(`https://api.vercel.com/v13/deployments/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${MY_TOKEN}` }
            });
            history.splice(index, 1);
            localStorage.setItem('gigs_deploy_history', JSON.stringify(history));
            renderHistory();
        } catch (err) { alert("Gagal hapus!"); }
    }
</script>
</body>
      </html>
